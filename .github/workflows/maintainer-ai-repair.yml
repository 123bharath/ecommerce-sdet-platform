name: Maintainer AI Test Repair & Validation

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Workflow Run ID of the failed Playwright CI run'
        required: true
        type: string
      source_commit:
        description: 'Full 40-character SHA of the failing commit'
        required: true
        type: string
      pr_number:
        description: 'Pull Request number (optional if repairing branch)'
        required: false
        type: string
      base_branch:
        description: 'Base target branch (default: main)'
        required: true
        default: 'main'
        type: string
      gemini_model:
        description: 'Gemini model to use for repair diagnosis'
        required: true
        default: 'gemini-3.5-flash'
        type: string
      gemini_fallback_model:
        description: 'Fallback Gemini model to use if primary model encounters transient errors'
        required: false
        default: 'gemini-3.5-flash-lite'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  generate-repair:
    name: "Generate Candidate Patch (Trusted ref: main)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      can_heal: ${{ steps.gate-outputs.outputs.can_heal }}
      source_commit: ${{ steps.verify-metadata.outputs.source_commit }}
      target_file: ${{ steps.verify-metadata.outputs.target_file }}
      test_file: ${{ steps.verify-metadata.outputs.test_file }}
      healed_locator: ${{ steps.generate.outputs.healed_locator }}
      pr_number: ${{ steps.verify-metadata.outputs.pr_number }}
      head_branch: ${{ steps.verify-metadata.outputs.head_branch }}

    steps:
      - name: Validate Source Commit SHA Format
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid source_commit: Must be a full 40-character hexadecimal SHA."
            exit 1
          fi

      - name: Checkout trusted default branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install trusted dependencies from main
        run: npm ci

      - name: Download Failure Artifacts from CI Run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          mkdir -p downloaded-artifacts
          gh run download "$CI_RUN_ID" --name playwright-healing-artifacts --dir downloaded-artifacts

      - name: Verify CI Run Metadata, PR Integrity & Artifact Lineage
        id: verify-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          CONTEXT_PATH: downloaded-artifacts/test-results/healing-context.json
          EVIDENCE_PATH: downloaded-artifacts/test-results/live-evidence.json
        run: |
          node scripts/verify-ci-metadata.js

      - name: Generate AI Repair Patch with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          GEMINI_FALLBACK_MODEL: ${{ inputs.gemini_fallback_model }}
          SOURCE_COMMIT: ${{ steps.verify-metadata.outputs.source_commit }}
          TARGET_POM: ${{ steps.verify-metadata.outputs.target_file }}
          CONTEXT_PATH: downloaded-artifacts/test-results/healing-context.json
          EVIDENCE_PATH: downloaded-artifacts/test-results/live-evidence.json
        run: |
          mkdir -p candidate-output
          node scripts/ai-repair-agent.js \
            --generate-only \
            --context "$CONTEXT_PATH" \
            --evidence "$EVIDENCE_PATH" \
            --source-commit "$SOURCE_COMMIT" \
            --target-pom "$TARGET_POM" \
            --output-dir candidate-output \
            --model "$GEMINI_MODEL" \
            --fallback-model "$GEMINI_FALLBACK_MODEL"

      - name: Verify Candidate Patch Structure and Syntax
        if: steps.generate.outputs.can_heal == 'true'
        env:
          TARGET_POM: ${{ steps.verify-metadata.outputs.target_file }}
          SOURCE_COMMIT: ${{ steps.verify-metadata.outputs.source_commit }}
        run: |
          node -e '
            const fs = require("fs");
            const { validatePatchAst, resolveCandidatePatch } = require("./scripts/ai-repair-agent");
            const res = resolveCandidatePatch("candidate-output");
            const patch = fs.readFileSync(res.patchPath, "utf8");
            validatePatchAst(patch, process.env.TARGET_POM, process.env.SOURCE_COMMIT);
            console.log("Candidate patch syntax, structure, and target confinement verified.");
          '

      - name: Upload Candidate Patch Artifact
        if: steps.generate.outputs.can_heal == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-candidate
          path: |
            candidate-output/repair.patch
            candidate-output/repair-summary.json
          retention-days: 7

      - name: Gate Repair Generation Outputs
        id: gate-outputs
        if: steps.generate.outputs.can_heal == 'true'
        run: |
          echo "can_heal=true" >> "$GITHUB_OUTPUT"

  validate-repair:
    name: Validate Repair (Secret-Free Isolated PR Environment)
    needs: generate-repair
    if: needs.generate-repair.result == 'success' && needs.generate-repair.outputs.can_heal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validation_passed: ${{ steps.gate-validation.outputs.validation_passed }}

    # ZERO SECRETS PERMITTED IN THIS JOB ENVIRONMENT
    env: {}

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository at source_commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Candidate Patch Artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-repair-candidate
          path: candidate-patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies in test environment
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
          npx playwright install --with-deps chromium

      - name: Create Isolated Worktree & Apply Patch
        id: apply-patch
        env:
          CANDIDATE_DIR: candidate-patch
        run: |
          node -e '
            const { resolveCandidatePatch } = require("./scripts/ai-repair-agent");
            const res = resolveCandidatePatch(process.env.CANDIDATE_DIR);
            console.log("Candidate patch verified (" + res.size + " bytes) at " + res.patchPath);
          '

          echo "Setting up isolated worktree for patch validation..."
          git worktree add ../validation-workspace HEAD
          cd ../validation-workspace

          PATCH_FILE="${GITHUB_WORKSPACE}/candidate-patch/repair.patch"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          echo "Patch applied cleanly in isolated worktree."

      - name: Start Services in Isolated Workspace
        run: |
          cd ../validation-workspace
          npm start --prefix backend &
          node scripts/wait-for.js http://localhost:4000/api/products 30
          node scripts/seed-products.js
          npm run dev --prefix frontend -- --host 0.0.0.0 --port 5173 &
          node scripts/wait-for.js http://localhost:5173 30
        env:
          PORT: 4000
          MONGODB_URI: mongodb://localhost:27017/ecommerce_sdet
          API_BASE_URL: http://localhost:4000

      - name: Tier 1 - Execute Primary Failed UI Test Spec
        id: tier1
        env:
          TEST_FILE: ${{ needs.generate-repair.outputs.test_file }}
        run: |
          cd ../validation-workspace
          if [[ "$TEST_FILE" =~ \.\. ]] || ! [[ "$TEST_FILE" =~ ^tests/ui/[a-zA-Z0-9_-]+\.spec\.(js|ts)$ ]]; then
            echo "::error::Invalid test file spec path: Must reside under tests/ui/*.spec.(js|ts). Received: $TEST_FILE"
            exit 1
          fi
          echo "Executing primary failing UI test spec: $TEST_FILE"
          npx playwright test "$TEST_FILE" --project=ui

      - name: Tier 2 - Execute Full UI Regression Suite
        id: tier2
        run: |
          cd ../validation-workspace
          echo "Executing full UI regression suite to confirm zero regressions..."
          npx playwright test --project=ui

      - name: Tier 3 - Execute Full API Regression Suite
        id: tier3
        run: |
          cd ../validation-workspace
          echo "Executing full API regression suite..."
          npx playwright test --project=api

      - name: Clean up Isolated Worktree
        if: always()
        run: |
          pkill -f "npm start --prefix backend" 2>/dev/null || true
          pkill -f "npm run dev --prefix frontend" 2>/dev/null || true
          git worktree remove --force ../validation-workspace 2>/dev/null || true

      - name: Generate Validation Report & Step Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TIER1_STATUS: ${{ steps.tier1.outcome }}
          TIER2_STATUS: ${{ steps.tier2.outcome }}
          TIER3_STATUS: ${{ steps.tier3.outcome }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET_FILE: ${{ needs.generate-repair.outputs.target_file }}
          TEST_FILE: ${{ needs.generate-repair.outputs.test_file }}
          HEALED_LOCATOR: ${{ needs.generate-repair.outputs.healed_locator }}
        run: |
          node -e '
            const fs = require("fs");
            const t1 = process.env.TIER1_STATUS === "success";
            const t2 = process.env.TIER2_STATUS === "success";
            const t3 = process.env.TIER3_STATUS === "success";
            const jobSuccess = process.env.JOB_STATUS === "success";
            const isSuccess = t1 && t2 && t3 && jobSuccess;
            const badge = isSuccess ? "🟢 VALIDATED REPAIR CANDIDATE AVAILABLE" : "🔴 VALIDATION FAILED";

            const formatTier = (status) => {
              if (status === "success") return "✅ PASSED";
              if (status === "failure") return "❌ FAILED";
              if (status === "cancelled") return "⏹️ CANCELLED";
              return "⚠️ " + (status || "SKIPPED").toUpperCase();
            };

            const lines = [
              `## 🤖 Antigravity AI Repair Validation Report`,
              "",
              `| Parameter | Details |`,
              `|:---|:---|`,
              `| **Verdict** | **${badge}** |`,
              `| **Source Commit** | \`${process.env.SOURCE_COMMIT}\` |`,
              `| **Target POM** | \`${process.env.TARGET_FILE}\` |`,
              `| **Primary Spec** | \`${process.env.TEST_FILE}\` |`,
              `| **Healed Locator** | \`${process.env.HEALED_LOCATOR}\` |`,
              `| **Tier 1 (Primary Spec)** | ${formatTier(process.env.TIER1_STATUS)} |`,
              `| **Tier 2 (UI Regression)** | ${formatTier(process.env.TIER2_STATUS)} |`,
              `| **Tier 3 (API Regression)** | ${formatTier(process.env.TIER3_STATUS)} |`,
              `| **Permissions Guard** | 🔒 \`contents: read\` (Zero automated branches, commits, or PRs) |`,
              "",
              "### How to Review and Apply This Repair Locally",
              "```bash",
              `git fetch origin ${process.env.SOURCE_COMMIT}`,
              `git checkout ${process.env.SOURCE_COMMIT}`,
              "# Download repair.patch from job artifacts and apply:",
              "git apply repair.patch",
              "```"
            ];

            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            if (summaryFile) {
              fs.appendFileSync(summaryFile, lines.join("\n") + "\n", "utf8");
            }
          '

      - name: Gate Validation Outputs
        id: gate-validation
        if: steps.tier1.outcome == 'success' && steps.tier2.outcome == 'success' && steps.tier3.outcome == 'success'
        run: |
          echo "validation_passed=true" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const sumPath = "candidate-patch/repair-summary.json";
            if (fs.existsSync(sumPath)) {
              const summary = JSON.parse(fs.readFileSync(sumPath, "utf8"));
              summary.status = "VERIFIED";
              summary.validationOutput = "All three tiers (Tier 1: primary failed spec, Tier 2: full UI regression suite, Tier 3: full API regression suite) passed cleanly in isolated environment.";
              fs.writeFileSync(sumPath, JSON.stringify(summary, null, 2), "utf8");
              console.log("Updated repair-summary.json status to VERIFIED.");
            }
          '

      - name: Upload Validated Repair Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-ai-repair
          path: |
            candidate-patch/repair.patch
            candidate-patch/repair-summary.json
          if-no-files-found: ignore
          retention-days: 14

  publish-repair:
    name: "Publish Repair Proposal (Draft PR & Isolated Branch)"
    needs: [generate-repair, validate-repair]
    if: needs.generate-repair.outputs.can_heal == 'true' && needs.validate-repair.result == 'success' && needs.validate-repair.outputs.validation_passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    # ZERO SECRETS PERMITTED - GEMINI_API_KEY IS NOT EXPOSED
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted default branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install trusted dependencies
        run: npm ci

      - name: Download Validated Repair Artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-ai-repair
          path: validated-patch

      - name: Re-Verify PR Head SHA (Reject Stale Candidates)
        id: reverify-head
        env:
          PR_NUMBER: ${{ needs.generate-repair.outputs.pr_number }}
          SOURCE_COMMIT: ${{ needs.generate-repair.outputs.source_commit }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "Re-verifying PR #$PR_NUMBER head SHA before publishing..."
            CURRENT_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
            CURRENT_STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$CURRENT_STATE" != "OPEN" ]; then
              echo "::error::PR #$PR_NUMBER is not OPEN (state: $CURRENT_STATE). Aborting publish."
              exit 1
            fi
            if [ "$CURRENT_HEAD" != "$SOURCE_COMMIT" ]; then
              echo "::error::PR #$PR_NUMBER head has mutated from $SOURCE_COMMIT to $CURRENT_HEAD while validation was running. Aborting publish."
              exit 1
            fi
            echo "✓ PR #$PR_NUMBER head remains unchanged at $SOURCE_COMMIT."
          fi

      - name: Create Isolated Repair Branch & Draft PR
        id: create-pr
        env:
          SOURCE_COMMIT: ${{ needs.generate-repair.outputs.source_commit }}
          TARGET_FILE: ${{ needs.generate-repair.outputs.target_file }}
          HEAD_BRANCH: ${{ needs.generate-repair.outputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          PR_NUMBER: ${{ needs.generate-repair.outputs.pr_number }}
        run: |
          node -e '
            const { resolveCandidatePatch } = require("./scripts/ai-repair-agent");
            const res = resolveCandidatePatch("validated-patch");
            console.log("Validated patch verified (" + res.size + " bytes) at " + res.patchPath);
          '

          TARGET_BASE="${HEAD_BRANCH:-$BASE_BRANCH}"
          TARGET_BASENAME=$(basename "$TARGET_FILE" .js)
          SHORT_SHA=$(echo "$SOURCE_COMMIT" | cut -c1-7)
          REPAIR_BRANCH="ai-repair/heal-${TARGET_BASENAME}-${SHORT_SHA}"

          echo "Target Base Branch: $TARGET_BASE"
          echo "Repair Branch:      $REPAIR_BRANCH"

          # Configure Git user for the automated repair commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          node scripts/create-repair-pr.js \
            --repair-branch "$REPAIR_BRANCH" \
            --base-branch "$TARGET_BASE" \
            --source-commit "$SOURCE_COMMIT" \
            --patch validated-patch/repair.patch \
            --summary validated-patch/repair-summary.json

      - name: Generate Publishing Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REPAIR_STATUS: ${{ steps.create-pr.outcome }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          REPAIR_BRANCH: ${{ steps.create-pr.outputs.repair_branch }}
        run: |
          echo "## 🚀 Antigravity AI Repair Publishing Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REPAIR_STATUS" = "success" ]; then
            echo "✅ **Repair branch pushed and draft pull request opened successfully.**" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$PR_URL" ]; then
              echo "- **Draft Repair PR**: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$REPAIR_BRANCH" ]; then
              echo "- **Branch**: \`$REPAIR_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- **Human Review Gate**: Auto-merge is disabled. Human SDET review required before merging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Failed to publish repair branch or draft PR.** Check job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi

