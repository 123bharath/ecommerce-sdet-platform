name: Playwright Tests

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      project:
        description: 'Select test project to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - ui

permissions:
  contents: read

jobs:
  test:
    name: API & UI Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: npm start --prefix backend &
        env:
          PORT: 4000
          MONGODB_URI: mongodb://localhost:27017/ecommerce_sdet

      - name: Wait for Backend API
        run: node scripts/wait-for.js http://localhost:4000/api/products 30

      - name: Seed Test Product Catalog
        run: node scripts/seed-products.js
        env:
          API_BASE_URL: http://localhost:4000

      - name: Start Frontend Development Server
        run: npm run dev --prefix frontend -- --host 0.0.0.0 --port 5173 &

      - name: Wait for Frontend Server
        run: node scripts/wait-for.js http://localhost:5173 30

      - name: Execute Playwright Test Suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_PROJECT: ${{ inputs.project || 'all' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$SELECTED_PROJECT" in
              api)
                npm run test:heal -- --project=api
                ;;
              ui)
                npm run test:heal -- --project=ui
                ;;
              all)
                npm run test:heal -- --project=api --project=ui
                ;;
              *)
                echo "Unsupported project selection: $SELECTED_PROJECT"
                exit 1
                ;;
            esac
          else
            npm run test:heal -- --project=api --project=ui
          fi

      - name: Upload Test & Failure Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-healing-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Diagnostic AI Repair Eligibility Evaluation
        if: failure()
        run: |
          echo "Evaluating locator healing eligibility in read-only diagnostic mode..."
          node scripts/check-repair-eligibility.js test-results/healing-context.json || true
